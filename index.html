<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#163a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="回访管家">
  <meta name="description" content="个人客户两月回访与倒计时提醒工具">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>客户回访管家</title>
  <style>
    :root{--ink:#152535;--muted:#697786;--navy:#163a5f;--navy2:#24577f;--gold:#d5a73e;--red:#d9414b;--orange:#e88928;--green:#27845d;--line:#dfe6ed;--bg:#f3f6f9;--card:#fff;--shadow:0 14px 35px rgba(26,47,70,.08)}
    *{box-sizing:border-box}html{font-size:16px;background:var(--bg);width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}body{margin:0;width:100%;overflow-x:hidden;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","SF Pro Text","Helvetica Neue","Microsoft YaHei",sans-serif;font-weight:400;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:linear-gradient(180deg,#e9f0f6 0,#f5f7f9 280px);min-height:100vh;touch-action:pan-y}
    button,input,textarea,select{font:inherit;font-size:16px}button,a{touch-action:manipulation}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:96px}
    header{padding:max(22px,env(safe-area-inset-top)) 18px 20px;background:linear-gradient(135deg,#112f4e,#1d4c73);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 12px 32px rgba(15,47,76,.2)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:.78rem;letter-spacing:.16em;opacity:.7;margin:0 0 4px}.title{font-size:1.55rem;font-weight:750;margin:0}.today{font-size:.78rem;opacity:.8;margin-top:5px}.icon-btn{width:43px;height:43px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.1);color:#fff;border-radius:14px;display:grid;place-items:center}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:12px}.stat strong{display:block;font-size:1.45rem}.stat span{font-size:.74rem;opacity:.75}.stat.danger strong{color:#ffafb4}.stat.warn strong{color:#ffd38a}
    main{padding:18px}.toolbar{display:flex;gap:10px}.search{flex:1;position:relative}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px 0 42px;color:var(--ink);outline:none}.search svg{position:absolute;left:14px;top:13px;color:#7b8997}.primary{height:46px;border:0;border-radius:15px;background:var(--navy);color:#fff;padding:0 17px;font-weight:700;box-shadow:0 8px 18px rgba(22,58,95,.18);white-space:nowrap}
    .filters{display:flex;gap:8px;overflow:auto;padding:14px 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 13px;white-space:nowrap;font-size:.88rem}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .notice{display:none;align-items:flex-start;gap:11px;padding:13px 14px;border:1px solid #d6e2ed;background:#edf5fb;border-radius:16px;margin:5px 0 12px;color:#31516d;font-size:.86rem;line-height:1.45}.notice.show{display:flex}.notice button{border:0;background:transparent;color:var(--navy);font-weight:700;padding:0;margin-left:auto;white-space:nowrap}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:8px 2px 10px}.section-head h2{font-size:1rem;margin:0}.section-head span{color:var(--muted);font-size:.8rem}.list{display:grid;gap:11px}
    .client{background:var(--card);border:1px solid #e4e9ee;border-radius:20px;padding:15px;box-shadow:var(--shadow)}.client-top{display:flex;gap:12px;align-items:flex-start}.client-profile{min-width:0;flex:1;display:flex;gap:12px;align-items:flex-start;padding:0;border:0;background:transparent;color:inherit;text-align:left}.avatar{width:45px;height:45px;border-radius:15px;background:#e6eef5;color:var(--navy);display:grid;place-items:center;font-size:1.05rem;font-weight:700;flex:0 0 auto}.client-info{display:block;min-width:0;flex:1;padding-top:1px}.client-name{display:block;font-weight:700;font-size:1.04rem;line-height:1.3;color:var(--navy)}.client-profile:active{opacity:.65}.meta{display:block;color:var(--muted);font-size:.8rem;line-height:1.35;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{font-weight:700;text-align:right;white-space:nowrap;font-size:.92rem;font-variant-numeric:tabular-nums}.count small{display:block;font-size:.7rem;font-weight:400;color:var(--muted);margin-top:3px}.count.overdue{color:var(--red)}.count.soon{color:var(--orange)}.count.ok{color:var(--green)}
    .due-line{height:5px;background:#edf1f4;border-radius:8px;margin:13px 0 12px;overflow:hidden}.due-line i{display:block;height:100%;border-radius:8px;background:var(--green)}.client.overdue .due-line i{background:var(--red)}.client.soon .due-line i{background:var(--orange)}
    .actions{display:flex;gap:8px}.action{flex:1;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;color:#425466;font-weight:650;font-size:.84rem}.action.done{background:#eaf6f1;border-color:#cbe7db;color:#20724f}.more{width:40px;flex:0 0 40px}
    .empty{text-align:center;padding:52px 22px;background:#fff;border:1px dashed #ccd7e0;border-radius:22px;color:var(--muted)}.empty .cal{width:58px;height:58px;border-radius:18px;margin:0 auto 15px;display:grid;place-items:center;background:#e8eff5;color:var(--navy)}.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:7px}.empty p{font-size:.88rem;line-height:1.55;margin:0 0 17px}
    nav{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);height:76px;padding:8px max(18px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);border-top:1px solid var(--line);backdrop-filter:blur(18px);display:flex;justify-content:space-around}.navbtn{border:0;background:transparent;color:#7b8895;display:grid;place-items:center;gap:3px;font-size:.7rem;min-width:80px}.navbtn.active{color:var(--navy);font-weight:700}.navbtn svg{width:22px;height:22px}
    dialog{border:0;border-radius:25px 25px 0 0;padding:0;width:100vw;max-width:100%;margin:auto 0 0;background:#fff;color:var(--ink);box-shadow:0 -20px 70px rgba(10,25,40,.25);overflow:hidden}dialog::backdrop{background:rgba(9,23,36,.45);backdrop-filter:blur(2px)}.sheet{padding:14px 18px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}.handle{width:42px;height:5px;background:#dbe1e7;border-radius:9px;margin:0 auto 13px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.sheet-head h2{font-size:1.2rem;margin:0}.close{border:0;background:#edf1f4;width:40px;height:40px;border-radius:13px;color:#53606c;flex:0 0 auto}
    form{display:grid;gap:13px;width:100%;min-width:0}.field{display:grid;gap:7px;min-width:0;width:100%}.field label{font-size:.88rem;color:#536271;font-weight:650}.field input,.field textarea,.field select{display:block;width:100%;max-width:100%;min-width:0;border:1px solid var(--line);background:#f9fbfc;border-radius:14px;min-height:48px;padding:11px 13px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}.field input[type="date"]{text-align:left}.field textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:minmax(0,1fr);gap:13px;width:100%}.submit{height:50px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-weight:750;margin-top:4px}.danger-btn{border:0;background:#fff0f1;color:var(--red);height:44px;border-radius:14px;font-weight:700}.subtle{color:var(--muted);font-size:.78rem;line-height:1.5;margin:0}.history-block{border-top:1px solid var(--line);margin-top:5px;padding-top:15px}.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.history-head strong{font-size:.96rem}.history-head span{font-size:.76rem;color:var(--muted)}.timeline{display:grid;gap:0}.event{position:relative;padding:0 0 17px 27px}.event:not(:last-child):before{content:"";position:absolute;left:7px;top:15px;bottom:0;width:2px;background:#dfe7ee}.event-dot{position:absolute;left:0;top:3px;width:16px;height:16px;border:4px solid #dbe7f0;background:var(--navy);border-radius:50%}.event.activation .event-dot{background:var(--gold);border-color:#f5ead0}.event.followup .event-dot{background:var(--green);border-color:#d9eee6}.event-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.event-type{font-size:.84rem;font-weight:750}.event-date{font-size:.76rem;color:var(--muted)}.event-note{font-size:.8rem;color:#586979;line-height:1.45;margin-top:5px;white-space:pre-wrap}.event-next{font-size:.73rem;color:var(--navy);margin-top:5px}.settings{display:grid;gap:11px}.setting{display:flex;align-items:center;gap:12px;background:#f7f9fb;border:1px solid var(--line);padding:14px;border-radius:16px}.setting-text{flex:1;min-width:0}.setting-text strong{display:block;font-size:.92rem}.setting-text span{display:block;color:var(--muted);font-size:.76rem;margin-top:4px;line-height:1.35}.setting button,.file-label{border:0;background:#e5edf4;color:var(--navy);border-radius:11px;padding:9px 12px;font-size:.78rem;font-weight:700;white-space:nowrap}.toast{position:fixed;z-index:30;left:50%;bottom:94px;transform:translate(-50%,20px);background:#14283a;color:#fff;padding:11px 16px;border-radius:13px;font-size:.86rem;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.2)}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-width:700px){body{padding:24px}.app{background:#f7f9fb;border-radius:30px;overflow:hidden;box-shadow:0 28px 80px rgba(20,40,60,.15)}header{border-radius:0 0 28px 28px}nav{bottom:24px;border-radius:0 0 30px 30px}.list{grid-template-columns:1fr 1fr}dialog{margin:auto;border-radius:25px;max-width:560px}.sheet{max-height:80vh;padding:18px 20px}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="top"><div><p class="eyebrow">PERSONAL CRM</p><h1 class="title">客户回访管家</h1><div class="today" id="today"></div></div><button class="icon-btn" id="settingsBtn" aria-label="设置">⚙︎</button></div>
    <div class="summary"><div class="stat danger"><strong id="overdueCount">0</strong><span>已逾期</span></div><div class="stat warn"><strong id="weekCount">0</strong><span>7天内</span></div><div class="stat"><strong id="totalCount">0</strong><span>全部客户</span></div></div>
  </header>
  <main>
    <div class="toolbar"><div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="搜索姓名、电话或项目" aria-label="搜索客户"></div><button class="primary" id="addBtn">＋ 添加</button></div>
    <div class="filters" role="tablist"><button class="chip active" data-filter="all">全部</button><button class="chip" data-filter="overdue">已逾期</button><button class="chip" data-filter="soon">7天内</button><button class="chip" data-filter="later">待回访</button></div>
    <div class="notice" id="notifyTip"><span>🔔</span><span>开启通知后，每次打开 App 会提醒已到期客户。</span><button id="notifyBtn">开启</button></div>
    <div class="section-head"><h2 id="listTitle">全部客户</h2><span id="resultCount">0 位</span></div>
    <div class="list" id="clientList"></div>
  </main>
  <nav><button class="navbtn active" id="homeNav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-6h6v6"/></svg><span>回访</span></button><button class="navbtn" id="addNav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-5 3.3-7 8-7s7.3 2 8 7M19 5v6M16 8h6"/></svg><span>添加客户</span></button><button class="navbtn" id="dataNav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4zM8 9h8M8 13h8M8 17h5"/></svg><span>数据</span></button></nav>
</div>

<dialog id="clientDialog"><div class="sheet"><div class="handle"></div><div class="sheet-head"><h2 id="dialogTitle">添加客户</h2><button class="close" data-close="clientDialog">✕</button></div><form id="clientForm"><input type="hidden" id="clientId"><div class="row"><div class="field"><label for="name">客户姓名 *</label><input id="name" required placeholder="例如：张女士"></div><div class="field"><label for="phone">手机号</label><input id="phone" inputmode="tel" placeholder="用于快捷联系"></div></div><div class="row"><div class="field"><label for="service">服务项目</label><input id="service" placeholder="例如：密发疗程"></div><div class="field"><label for="source">客户来源</label><input id="source" placeholder="例如：浣纱门店"></div></div><div class="row"><div class="field"><label for="lastDate">首次操作日期 *</label><input id="lastDate" type="date" required></div><div class="field"><label for="nextDate">下次激活日期 *</label><input id="nextDate" type="date" required></div></div><p class="subtle">首次操作默认生成两个月后的激活提醒；以后每次激活可选择一个月或两个月后再次提醒。</p><div class="field"><label for="notes">客户档案备注</label><textarea id="notes" placeholder="头皮情况、疗程目标、需要持续关注的事项……"></textarea></div><div class="history-block" id="historyBlock" hidden><div class="history-head"><strong>操作与激活记录</strong><span id="historyCount"></span></div><div class="timeline" id="timeline"></div></div><button class="submit" type="submit">保存客户档案</button><button class="action" id="calendarBtn" type="button" hidden>加入 iPhone 日历提醒</button><button class="danger-btn" id="deleteBtn" type="button" hidden>删除客户</button></form></div></dialog>

<dialog id="eventDialog"><div class="sheet"><div class="handle"></div><div class="sheet-head"><h2 id="eventTitle">记录激活操作</h2><button class="close" data-close="eventDialog">✕</button></div><form id="eventForm"><input type="hidden" id="eventClientId"><div class="field"><label for="eventDate">本次激活日期 *</label><input id="eventDate" type="date" required></div><div class="field"><label for="intervalMonths">下次激活时间 *</label><select id="intervalMonths"><option value="1">1个月后</option><option value="2" selected>2个月后</option></select></div><div class="field"><label for="eventNote">本次激活记录 *</label><textarea id="eventNote" required placeholder="操作部位、毛囊情况、顾客反馈、后续注意事项……"></textarea></div><p class="subtle" id="eventHint">下次激活日期将按本次日期自动计算。</p><button class="submit" type="submit">保存激活记录</button></form></div></dialog>

<dialog id="settingsDialog"><div class="sheet"><div class="handle"></div><div class="sheet-head"><h2>提醒与数据</h2><button class="close" data-close="settingsDialog">✕</button></div><div class="settings"><div class="setting"><div class="setting-text"><strong>iPhone 通知</strong><span>打开 App 时，系统通知当天到期及逾期客户</span></div><button id="settingNotify">开启</button></div><div class="setting"><div class="setting-text"><strong>安装到主屏幕</strong><span>iPhone Safari 点“分享”→“添加到主屏幕”，使用更像独立 App</span></div></div><div class="setting"><div class="setting-text"><strong>导出备份</strong><span>下载全部客户数据，换手机前建议备份</span></div><button id="exportBtn">导出</button></div><div class="setting"><div class="setting-text"><strong>导入备份</strong><span>恢复此前导出的 JSON 文件</span></div><label class="file-label">选择文件<input id="importInput" type="file" accept="application/json" hidden></label></div></div></div></dialog>
<div class="toast" id="toast"></div>

<script>
const STORE='customer-followup-v1';
let clients=normalizeClients(load()),filter='all',query='';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=d=>new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric'}).format(new Date(d+'T00:00:00'));
const iso=d=>{const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};
const today=()=>iso(new Date());
const daysUntil=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
const plusMonths=(s,n=2)=>{const d=new Date(s+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};
function load(){try{return JSON.parse(localStorage.getItem(STORE))||[]}catch{return []}}
function save(){localStorage.setItem(STORE,JSON.stringify(clients))}
function normalizeClients(list){return list.map(c=>{if(!Array.isArray(c.records)||!c.records.length){const base=c.initialDate||c.lastDate||(c.createdAt||'').slice(0,10)||today();c.initialDate=base;c.records=[{id:'initial-'+c.id,type:'initial',date:base,note:'首次操作',intervalMonths:2,nextDate:c.nextDate||plusMonths(base),createdAt:c.createdAt||new Date().toISOString()}];for(const h of (c.history||[])){if(h.date&&h.date!==base)c.records.push({id:crypto.randomUUID(),type:'followup',date:h.date,note:'历史回访记录',createdAt:h.date+'T12:00:00'})}}return c})}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function status(c){const d=daysUntil(c.nextDate);return d<0?'overdue':d<=7?'soon':'later'}
function countdown(c){const d=daysUntil(c.nextDate);if(d<0)return `逾期 ${Math.abs(d)} 天`;if(d===0)return '今天回访';if(d===1)return '明天回访';return `还剩 ${d} 天`}
function initials(name){return [...(name||'客户')].slice(-2).join('')}
function render(){
  const sorted=[...clients].sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
  const visible=sorted.filter(c=>(filter==='all'||status(c)===filter)&&[c.name,c.phone,c.service,c.source,c.notes].join(' ').toLowerCase().includes(query.toLowerCase()));
  $('#overdueCount').textContent=clients.filter(c=>status(c)==='overdue').length;
  $('#weekCount').textContent=clients.filter(c=>status(c)==='soon').length;
  $('#totalCount').textContent=clients.length; $('#resultCount').textContent=`${visible.length} 位`;
  $('#listTitle').textContent=({all:'全部客户',overdue:'已逾期',soon:'7天内回访',later:'待回访'})[filter];
  $('#clientList').innerHTML=visible.length?visible.map(card).join(''):`<div class="empty"><div class="cal">▦</div><strong>${clients.length?'没有符合条件的客户':'还没有客户'}</strong><p>${clients.length?'换个筛选条件试试。':'添加第一位客户，系统会自动计算两个月后的回访日期。'}</p>${clients.length?'':'<button class="primary" onclick="openClient()">添加第一位客户</button>'}</div>`;
  $('#notifyTip').classList.toggle('show','Notification' in window&&Notification.permission==='default');
}
function card(c){const s=status(c),d=Math.max(0,Math.min(100,100-(daysUntil(c.nextDate)/62*100)));return `<article class="client ${s}"><div class="client-top"><button class="client-profile" onclick="openClient('${c.id}')" aria-label="查看${esc(c.name)}的客户档案"><span class="avatar">${esc(initials(c.name))}</span><span class="client-info"><span class="client-name">${esc(c.name)}</span><span class="meta">${esc(c.service||'未填写项目')} · ${(c.records||[]).length} 条记录</span></span></button><div class="count ${s==='later'?'ok':s}">${countdown(c)}<small>下次激活 · ${fmt(c.nextDate)}</small></div></div><div class="due-line"><i style="width:${d}%"></i></div><div class="actions"><button class="action done" onclick="openEvent('${c.id}')">记录本次激活</button><button class="action" onclick="openClient('${c.id}')">查看客户档案</button></div></article>`}
function openClient(id){
  const c=clients.find(x=>x.id===id); $('#clientForm').reset(); $('#clientId').value=c?.id||''; $('#dialogTitle').textContent=c?`${c.name}的客户档案`:'添加客户'; $('#deleteBtn').hidden=!c; $('#calendarBtn').hidden=!c;
  $('#name').value=c?.name||'';$('#phone').value=c?.phone||'';$('#service').value=c?.service||'';$('#source').value=c?.source||'';$('#lastDate').value=c?.initialDate||c?.lastDate||today();$('#nextDate').value=c?.nextDate||plusMonths(today());$('#notes').value=c?.notes||'';renderTimeline(c);$('#clientDialog').showModal();if(!c)setTimeout(()=>$('#name').focus(),150)
}
function recordLabel(type,seq){if(type==='activation')return `第 ${seq} 次激活/操作`;return ({initial:'首次操作',followup:'普通回访'})[type]||'记录'}
function renderTimeline(c){const block=$('#historyBlock'),box=$('#timeline');if(!c){block.hidden=true;box.innerHTML='';return}const chronological=[...(c.records||[])].sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));let count=0;const sequence={};for(const r of chronological)if(r.type==='activation')sequence[r.id]=++count;const records=chronological.reverse();block.hidden=false;$('#historyCount').textContent=`共 ${records.length} 条`;box.innerHTML=records.map(r=>`<div class="event ${r.type}"><i class="event-dot"></i><div class="event-top"><span class="event-type">${recordLabel(r.type,sequence[r.id])}</span><span class="event-date">${esc(r.date)}</span></div>${r.note?`<div class="event-note">${esc(r.note)}</div>`:''}${r.nextDate?`<div class="event-next">下次激活：${esc(r.nextDate)}${r.intervalMonths?`（${r.intervalMonths}个月后）`:''}</div>`:''}</div>`).join('')}
function openEvent(id){const c=clients.find(x=>x.id===id);if(!c)return;$('#eventForm').reset();$('#eventClientId').value=id;$('#eventDate').value=today();$('#intervalMonths').value='2';updateEventHint();$('#eventDialog').showModal()}
function updateEventHint(){const months=Number($('#intervalMonths').value),date=$('#eventDate').value;if(date)$('#eventHint').textContent=`下次激活日期：${fmt(plusMonths(date,months))}（${months}个月后）`;else $('#eventHint').textContent='选择日期后自动计算下次激活时间。'}
function openSettings(){$('#settingsDialog').showModal();updateNotifyButton()}
function updateNotifyButton(){const b=$('#settingNotify');if(!('Notification'in window)){b.textContent='不支持';b.disabled=true}else b.textContent=Notification.permission==='granted'?'已开启':Notification.permission==='denied'?'已拒绝':'开启'}
async function enableNotifications(){if(!('Notification'in window)){toast('当前浏览器不支持网页通知');return}const result=await Notification.requestPermission();updateNotifyButton();render();if(result==='granted'){toast('系统通知已开启');checkNotifications(true)}else toast('未获得通知权限')}
async function sendNotification(title,body){if(Notification.permission!=='granted')return;if(navigator.serviceWorker){const r=await navigator.serviceWorker.ready;r.showNotification(title,{body,icon:'/favicon.svg',tag:'followup-'+today()})}else new Notification(title,{body})}
function checkNotifications(force=false){const due=clients.filter(c=>daysUntil(c.nextDate)<=0);const key='notified-'+today();if(due.length&&(force||!localStorage.getItem(key))){sendNotification('客户回访提醒',due.length===1?`${due[0].name} 今天需要回访`:`有 ${due.length} 位客户已到回访时间`);localStorage.setItem(key,'1')}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2300)}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),clients},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`客户回访备份-${today()}.json`;a.click();URL.revokeObjectURL(a.href);toast('备份已导出')}
function calendarFor(c){const date=c.nextDate.replaceAll('-','');const clean=s=>String(s||'').replace(/[\\;,\n]/g,m=>'\\'+m);const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FollowUp//CN\r\nBEGIN:VEVENT\r\nUID:${c.id}-${date}@followup\r\nDTSTART:${date}T090000\r\nDTEND:${date}T093000\r\nSUMMARY:${clean('回访客户：'+c.name)}\r\nDESCRIPTION:${clean(c.notes)}\r\nBEGIN:VALARM\r\nTRIGGER:-PT1H\r\nACTION:DISPLAY\r\nDESCRIPTION:客户回访提醒\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download=`${c.name}-回访提醒.ics`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('日历提醒已生成，请按提示添加')}
function calendarForId(id){const c=clients.find(x=>x.id===id);if(c)calendarFor(c)}
$('#clientForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#clientId').value,initialDate=$('#lastDate').value,now=new Date().toISOString(),c={id:id||crypto.randomUUID(),name:$('#name').value.trim(),phone:$('#phone').value.trim(),service:$('#service').value.trim(),source:$('#source').value.trim(),initialDate,lastDate:initialDate,nextDate:$('#nextDate').value,notes:$('#notes').value.trim(),createdAt:now,records:[]};if(id){const old=clients.find(x=>x.id===id);c.createdAt=old.createdAt;c.lastDate=old.lastDate||initialDate;c.records=[...(old.records||[])];const first=c.records.find(r=>r.type==='initial');if(first){first.date=initialDate;first.intervalMonths=first.intervalMonths||2;if(first.nextDate)first.nextDate=$('#nextDate').value}else c.records.unshift({id:'initial-'+id,type:'initial',date:initialDate,note:'首次操作',intervalMonths:2,nextDate:c.nextDate,createdAt:now});clients=clients.map(x=>x.id===id?c:x)}else{c.records=[{id:'initial-'+c.id,type:'initial',date:initialDate,note:c.notes||'首次操作',intervalMonths:2,nextDate:c.nextDate,createdAt:now}];clients.push(c)}save();$('#clientDialog').close();render();toast(id?'客户档案已更新':'客户已添加并记录首次操作')});
$('#eventForm').addEventListener('submit',e=>{e.preventDefault();const c=clients.find(x=>x.id===$('#eventClientId').value);if(!c)return;const date=$('#eventDate').value,note=$('#eventNote').value.trim(),intervalMonths=Number($('#intervalMonths').value),nextDate=plusMonths(date,intervalMonths);c.records=[...(c.records||[]),{id:crypto.randomUUID(),type:'activation',date,note,intervalMonths,nextDate,createdAt:new Date().toISOString()}];c.lastDate=date;c.nextDate=nextDate;save();$('#eventDialog').close();render();toast(`${c.name}：下次激活 ${fmt(c.nextDate)}`)});
$('#eventDate').addEventListener('change',updateEventHint);$('#intervalMonths').addEventListener('change',updateEventHint);
$('#lastDate').addEventListener('change',e=>{$('#nextDate').value=plusMonths(e.target.value)});
$('#deleteBtn').addEventListener('click',()=>{const id=$('#clientId').value,c=clients.find(x=>x.id===id);if(c&&confirm(`确定删除 ${c.name} 吗？`)){clients=clients.filter(x=>x.id!==id);save();$('#clientDialog').close();render();toast('客户已删除')}});
$('#calendarBtn').addEventListener('click',()=>calendarForId($('#clientId').value));
$('#search').addEventListener('input',e=>{query=e.target.value;render()});$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});
$('#addBtn').onclick=$('#addNav').onclick=()=>openClient();$('#settingsBtn').onclick=$('#dataNav').onclick=openSettings;$('#notifyBtn').onclick=$('#settingNotify').onclick=enableNotifications;$('#exportBtn').onclick=exportData;
$('#importInput').addEventListener('change',async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.clients))throw Error();if(confirm(`导入 ${d.clients.length} 位客户并替换当前数据？`)){clients=d.clients;save();render();$('#settingsDialog').close();toast('数据已恢复')}}catch{toast('这个备份文件无法识别')}e.target.value=''});
$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
document.addEventListener('contextmenu',e=>{const card=e.target.closest('.client');if(!card)return});
document.addEventListener('dblclick',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
window.addEventListener('load',()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');checkNotifications();});
$('#today').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date());save();render();
function registerWebMCP(){const mc=document.modelContext;if(!mc?.registerTool)return;mc.registerTool({name:'add_customer',title:'添加客户',description:'添加一位客户，记录首次操作并设置两个月后的提醒。',inputSchema:{type:'object',properties:{name:{type:'string'},phone:{type:'string'},service:{type:'string'},notes:{type:'string'}},required:['name'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input?.name?.trim())throw new Error('客户姓名不能为空');const initialDate=today(),createdAt=new Date().toISOString(),id=crypto.randomUUID(),nextDate=plusMonths(initialDate),c={id,name:input.name.trim(),phone:input.phone||'',service:input.service||'',source:'',initialDate,lastDate:initialDate,nextDate,notes:input.notes||'',createdAt,records:[{id:'initial-'+id,type:'initial',date:initialDate,note:input.notes||'首次操作',intervalMonths:2,nextDate,createdAt}]};clients.push(c);save();render();return {id:c.id,name:c.name,nextActivation:c.nextDate}}});mc.registerTool({name:'list_due_customers',title:'查看待激活客户',description:'列出今天到期或已经逾期的客户。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(){return clients.filter(c=>daysUntil(c.nextDate)<=0).map(c=>({id:c.id,name:c.name,phone:c.phone,nextActivation:c.nextDate,days:daysUntil(c.nextDate)}))}})}
try{registerWebMCP()}catch(e){console.warn('WebMCP unavailable',e)}
</script>
</body></html>
